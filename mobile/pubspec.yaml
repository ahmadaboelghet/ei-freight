name: ei_freight_mobile
description: EI Freight — Freight Quotation Platform (Flutter Client)
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # ── Firebase ──────────────────────────────────────────────
  firebase_core: ^3.3.0
  firebase_auth: ^5.1.4
  cloud_functions: ^5.0.4

  # ── State Management ──────────────────────────────────────
  flutter_bloc: ^8.1.6
  equatable: ^2.0.5

  # ── Functional Programming (Either / Failure) ─────────────
  dartz: ^0.10.1

  # ── DI Container ─────────────────────────────────────────
  get_it: ^7.7.0

  # ── Navigation ────────────────────────────────────────────
  go_router: ^14.2.7

  # ── Utilities ─────────────────────────────────────────────
  intl: ^0.19.0
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  bloc_test: ^9.1.7
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
